<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_49 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_49" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_49');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Holographic Tactical Voice Orb & Audio Frequency Sphere
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Tactical Cyber Colors
const cyanColor = new THREE.Color(0x00f0ff);
const neonGreen = new THREE.Color(0x00ff66);
const deepViolet = new THREE.Color(0x7928ca);

// 1. Core Pulsing Holographic Icosahedron Wireframe
const innerGeo = new THREE.IcosahedronGeometry(2.0, 3);
const innerMat = new THREE.MeshBasicMaterial({
  color: 0x00f0ff,
  wireframe: true,
  transparent: true,
  opacity: 0.35,
  blending: THREE.AdditiveBlending
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
scene.add(innerMesh);

// 2. Audio Particle Cloud (Neural Lattice Points)
const particleCount = 750;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(particleCount * 3);
const originalRadii = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  const r = 2.4 + (Math.random() * 0.4);
  originalRadii[i] = r;
  
  particlePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  particlePos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  particlePos[i * 3 + 2] = r * Math.cos(phi);
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0x00ffcc,
  size: 0.08,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// 3. Orbital Gyro Tactical Reticle Rings
function createReticleRing(radius, tube, segments, colorHex, tiltX, tiltY) {
  const ringGeo = new THREE.TorusGeometry(radius, tube, 6, segments);
  const ringMat = new THREE.MeshBasicMaterial({
    color: colorHex,
    wireframe: true,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending
  });
  const ringMesh = new THREE.Mesh(ringGeo, ringMat);
  ringMesh.rotation.x = tiltX;
  ringMesh.rotation.y = tiltY;
  scene.add(ringMesh);
  return ringMesh;
}

const ring1 = createReticleRing(3.2, 0.02, 64, 0x00f0ff, Math.PI / 3, 0.2);
const ring2 = createReticleRing(3.6, 0.015, 48, 0x00ff66, -Math.PI / 4, 0.5);
const ring3 = createReticleRing(2.9, 0.025, 32, 0x3b82f6, 0.5, -Math.PI / 3);

// 4. Central Glowing Core Beacon
const coreGeo = new THREE.SphereGeometry(0.8, 16, 16);
const coreMat = new THREE.MeshBasicMaterial({
  color: 0x00ffff,
  wireframe: false,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
scene.add(coreMesh);

// Responsive handler
function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

// Clock & Animation Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Rotate inner mesh
  innerMesh.rotation.x = t * 0.25;
  innerMesh.rotation.y = t * 0.35;
  const pulse = 1 + Math.sin(t * 3.5) * 0.07;
  innerMesh.scale.set(pulse, pulse, pulse);

  // Audio waveform pulse simulation on particles
  const positions = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    const origR = originalRadii[i];
    const modulation = Math.sin(t * 5.0 + i * 0.15) * 0.18 + Math.cos(t * 2.8 + i * 0.3) * 0.12;
    const currentR = origR + modulation;
    
    const x = positions[i * 3];
    const y = positions[i * 3 + 1];
    const z = positions[i * 3 + 2];
    const length = Math.sqrt(x*x + y*y + z*z) || 1;
    
    positions[i * 3] = (x / length) * currentR;
    positions[i * 3 + 1] = (y / length) * currentR;
    positions[i * 3 + 2] = (z / length) * currentR;
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleSystem.rotation.y = -t * 0.15;
  particleSystem.rotation.x = Math.sin(t * 0.2) * 0.2;

  // Reticle rings counter-rotation
  ring1.rotation.z = t * 0.4;
  ring2.rotation.z = -t * 0.3;
  ring3.rotation.x = Math.PI / 4 + Math.sin(t * 0.5) * 0.2;
  ring3.rotation.z = t * 0.25;

  // Center beacon pulse
  const corePulse = 0.8 + Math.sin(t * 6.0) * 0.25;
  coreMesh.scale.set(corePulse, corePulse, corePulse);
  coreMat.opacity = 0.3 + Math.sin(t * 6.0) * 0.2;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_49 -->
</body>
</html>
